{% extends "admin/base_site.html" %}
{% load unfold %}

{% block content %}
<div class="pg pg-narrow">
  <header class="pg-head">
    <div>
      <h1>Send a test notification</h1>
      <p class="pg-sub">Goes out through the same queue and providers as real sends.</p>
    </div>
  </header>
  <form method="post" class="pg-panel">
    {% csrf_token %}
    {% for field in form %}
      {% include "unfold/helpers/field.html" with field=field %}
    {% endfor %}
    <div class="pg-form-actions">
      <a class="pg-btn pg-btn-ghost" href="{% url 'admin:notifications_app_notification_changelist' %}">Cancel</a>
      <button type="submit" class="pg-btn">Send</button>
    </div>
  </form>
</div>
{% endblock %}
