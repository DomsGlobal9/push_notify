# Render Blueprint for the push gateway.
#
# Starting setup (~$7/month on Render): one Starter web service running the API
# and the dispatcher together, in Singapore. The database is Supabase (project
# mobile_push, also Singapore), reached through its session pooler.
#
# To scale (see README "Scaling"): uncomment `push-dispatcher` below, set
# RUN_DISPATCHER_INLINE=false on the web service, and raise the dispatcher's
# instance count / plan as volume grows.

services:
  - type: web
    name: push-gateway
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash bin/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Supabase -> Connect -> "Transaction pooler" string, port 6543 (IPv4; the direct
      # db.* host is IPv6-only and unreachable from Render). Must end with ?sslmode=require
      # e.g. postgresql://postgres.<ref>:<password>@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # 32 random bytes, base64: `python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"`
      # BACK IT UP. Losing it makes every stored credential unreadable.
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RUN_DISPATCHER_INLINE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: PUSH_SEND_THREADS
        value: "32"

  # --- Scale-out: a dedicated dispatcher (Render Background Worker). ---
